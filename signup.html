<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register your Cycle Sphere rider profile to configure bespoke bicycle orders, track workshop calibration, and receive peloton benefits." />
  <title>Create Rider Profile | CYCLE SPHERE</title>

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="auth-page-wrapper">
      <div class="auth-form-card">
        <!-- Brand Name inside Box in Top Center -->
        <div class="auth-brand-center">
          <a href="index.html" class="brand-logo" aria-label="Cycle Sphere Home">
            <div class="brand-logo-mark">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18.5" cy="17.5" r="3.5"/>
                <circle cx="5.5" cy="17.5" r="3.5"/>
                <circle cx="15" cy="5" r="1"/>
                <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
              </svg>
            </div>
            <span>CYCLE<span class="accent">SPHERE</span></span>
          </a>
          <span class="auth-tagline">Find Your Ride. Define Your Journey.</span>
        </div>

        <div class="auth-header">
          <h2>Create Rider Profile</h2>
          <p>Join the global peloton to reserve bespoke builds and receive 10% off gear.</p>
        </div>

        <form id="signup-form">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="e.g. Marcus Vance" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <input type="email" id="signup-email" class="form-input" placeholder="rider@domain.com" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-pass">Create Password</label>
            <input type="password" id="signup-pass" class="form-input" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm-pass">Confirm Password</label>
            <input type="password" id="signup-confirm-pass" class="form-input" placeholder="Re-enter password" minlength="8" required autocomplete="new-password" />
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label class="form-checkbox-label">
              <input type="checkbox" id="signup-terms" required />
              <span>I agree to the <a href="about.html" style="text-decoration: underline; color: var(--primary);">Terms of Service</a> &amp; <a href="about.html" style="text-decoration: underline; color: var(--primary);">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Create Rider Account &rarr;
          </button>

          <!-- Social Divider -->
          <div class="auth-divider">
            <span>Or register with</span>
          </div>

          <!-- Google and Apple Social Icons at Bottom -->
          <div class="auth-social-buttons">
            <button type="button" class="btn-social" id="google-signup-btn" aria-label="Sign up with Google">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.92 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>

            <button type="button" class="btn-social" id="apple-signup-btn" aria-label="Sign up with Apple">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.79 1.06-1.88.94-2.98-.92.04-2.07.62-2.73 1.4-.58.67-1.08 1.77-.94 2.84 1.03.08 2.1-.47 2.73-1.26z"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>
        </form>

        <div class="auth-footer-links">
          Already registered? <a href="login.html">Sign In</a>
        </div>

        <a href="index.html" class="auth-back-home">&larr; Return to Cycle Sphere Fleet</a>
      </div>
    </div>
  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const signupForm = document.getElementById("signup-form");
      signupForm?.addEventListener("submit", (e) => {
        e.preventDefault();
        const p1 = document.getElementById("signup-pass").value;
        const p2 = document.getElementById("signup-confirm-pass").value;

        if (p1 !== p2) {
          if (window.Store) {
            window.Store.showToast("Passwords do not match. Please verify.", "warning");
          } else {
            alert("Passwords do not match.");
          }
          return;
        }

        const name = document.getElementById("signup-name").value;
        if (window.Store) {
          window.Store.showToast(`Account registered successfully for ${name}! Welcome to the peloton.`, "success");
        }
        setTimeout(() => {
          window.location.href = "shop.html";
        }, 1200);
      });

      document.getElementById("google-signup-btn")?.addEventListener("click", () => {
        if (window.Store) {
          window.Store.showToast("Google account registration connected.", "success");
        }
        setTimeout(() => { window.location.href = "shop.html"; }, 800);
      });

      document.getElementById("apple-signup-btn")?.addEventListener("click", () => {
        if (window.Store) {
          window.Store.showToast("Apple ID account registration connected.", "success");
        }
        setTimeout(() => { window.location.href = "shop.html"; }, 800);
      });
    });
  </script>
</body>
</html>
